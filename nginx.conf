pid /tmp/nginx.pid;
worker_processes 1;
error_log /dev/stderr warn;

events {
    worker_connections 128;
}

http {
    access_log off;
    server_tokens off;
    default_type text/plain;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    map $http_x_forwarded_for $ipify_address {
        ~^[[:space:]]*(?<ipify_first_address>[^,]*?[^,[:space:]])[[:space:]]*(?:,|$) $ipify_first_address;
        default "";
    }

    server {
        listen 80 default_server;
        server_name _;

        location = / {
            if ($ipify_address = "") {
                return 400;
            }
            return 200 "$ipify_address\n";
        }

        location = /healthz {
            return 200 "ok\n";
        }

        location / {
            return 404;
        }
    }
}
